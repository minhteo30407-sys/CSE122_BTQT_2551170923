<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style12.css">
</head>
<body>
    <div class="container">
        <div class="calendar">
            <div class="year" id="year">2026</div>
            <div class="month" id="month">Tháng 12</div>
            <div class="day" id="day">24</div>
            <div class="weekday" id="weekday">Thứ hai</div>
        </div>
        <div class="greeting" id="greeting">Chào buổi sáng!</div>
        <div class="form">
            <div>
                <label for="day">Ngày</label>
                <input type="number" id="inputday" value="24" min="1" max="31">
            </div>
            <div>
                <label for="month">Tháng</label>
                <input type="number" id="inputmonth" value="12" min="1" max="12">
            </div>
            <div>
                <label for="year">Năm</label>
                <input type="number" id="inputyear" value="2026">
            </div>
            <button id="print">In lịch</button>
        </div>
    </div>
    <script src="script12.js"></script>
</body>
</html>

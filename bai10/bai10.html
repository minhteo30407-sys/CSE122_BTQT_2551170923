
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên hệ với chúng tôi</title>
    <link rel="stylesheet" href="style10.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Liên hệ với chúng tôi</h1>
            <p>Vui lòng điền thông tin bên dưới, chúng tôi sẽ phản hồi trong 24 giờ.</p>
        </div>

        <form>
            <div class="form-grid">
                <div class="form-group">
                    <label for="name">Họ và tên</label>
                    <input type="text" id="name" value="Nguyễn Văn An">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" value="an.nv@tlu.edu.vn">
                </div>

                <div class="form-group">
                    <label for="phone">Số điện thoại</label>
                    <input type="tel" id="phone" value="0987 654 321">
                </div>

                <div class="form-group">
                    <label for="subject">Chủ đề</label>
                    <select id="subject">
                        <option>Hỏi về khoá học</option>
                        <option>Hỗ trợ kỹ thuật</option>
                        <option>Góp ý</option>
                        <option>Khác</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label for="content">Nội dung</label>
                    <textarea id="content" rows="4">Em muốn hỏi về lịch nộp bài tập môn Lập trình Web ạ.</textarea>
                </div>

                <div class="form-group full-width checkbox-group">
                    <input type="checkbox" id="agree" checked>
                    <label for="agree">Tôi đồng ý nhận email phản hồi.</label>
                </div>
            </div>

            <div class="buttons">
                <button type="submit">Gửi liên hệ</button>
                <button type="reset">Nhập lại</button>
            </div>
        </form>
    </div>
</body>
</html>

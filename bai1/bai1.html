        <h1><b>BỐN MÙA</b></h1>
    </header>
    <main>
        <p>Xuân về hoa nở khắp trời<br>Hạ sang nắng cháy rạng ngời phố quen<br>về lá rụng bên thềm</p>
        <hr>
        <p class="k2">Đông sang gió lạnh bên em đợi chờ<br>Bốn mùa là bốn giấc mơ<br>Thời gian đi mãi ta chờ đợi ai</p>
        <hr>
        <p>Một năm rồi lại một năm<br>Vẫn còn câu hát thì thầm quê hương<br>Chờ xuân nắng mới soi đường</p>
